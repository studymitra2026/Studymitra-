<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMitra - Algebra Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f6ff;
      margin: 0;
      padding: 16px;
      color: #172554;
    }
    .container {
      max-width: 750px;
      margin: auto;
    }
    h1 { color: #0755c9; text-align: center; }
    .question {
      background: white;
      padding: 16px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    .question p { font-weight: bold; }
    label {
      display: block;
      padding: 8px;
      margin: 5px 0;
      background: #f3f6fb;
      border-radius: 7px;
      cursor: pointer;
    }
    button {
      background: #0755c9;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px 22px;
      font-size: 17px;
      cursor: pointer;
      margin: 10px 5px 10px 0;
    }
    #result {
      background: white;
      padding: 18px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }
    .feedback { margin-top: 8px; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <h1>StudyMitra Algebra Quiz</h1>
  <p>Choose one answer for each question. Submit to see your score.</p>

  <form id="quizForm"></form>
  <button type="button" onclick="checkAnswers()">Submit Quiz</button>
  <button type="button" onclick="location.reload()">Try Again</button>
  <div id="result"></div>
</div>

<script>
const questions = [
  {
    q: "1. Solve: x + 5 = 12",
    options: ["5", "7", "8", "17"],
    answer: 1,
    explain: "Subtract 5 from both sides: x = 12 - 5 = 7."
  },
  {
    q: "2. Solve: 3x = 21",
    options: ["6", "7", "8", "9"],
    answer: 1,
    explain: "Divide both sides by 3: x = 21 / 3 = 7."
  },
  {
    q: "3. Simplify: 2x + 3x",
    options: ["5", "5x", "6x", "x"],
    answer: 1,
    explain: "Add like terms: 2x + 3x = 5x."
  },
  {
    q: "4. Solve: x - 4 = 9",
    options: ["5", "11", "13", "14"],
    answer: 2,
    explain: "Add 4 to both sides: x = 9 + 4 = 13."
  },
  {
    q: "5. Expand: 2(x + 3)",
    options: ["2x + 3", "2x + 6", "x + 6", "5x"],
    answer: 1,
    explain: "Multiply both terms by 2: 2x + 6."
  },
  {
    q: "6. Factorise: x² - 9",
    options: ["(x - 3)(x + 3)", "(x - 9)(x + 1)", "(x - 3)²", "(x + 9)(x - 1)"],
    answer: 0,
    explain: "Use a² - b² = (a - b)(a + b)."
  },
  {
    q: "7. Solve: 2x + 4 = 14",
    options: ["4", "5", "6", "7"],
    answer: 1,
    explain: "2x = 10, so x = 5."
  },
  {
    q: "8. What is the coefficient of x in 7x + 2?",
    options: ["2", "7", "x", "9"],
    answer: 1,
    explain: "The number multiplying x is 7."
  },
  {
    q: "9. Simplify: 4a - a + 2a",
    options: ["5a", "6a", "7a", "a"],
    answer: 0,
    explain: "4a - a + 2a = (4 - 1 + 2)a = 5a."
  },
  {
    q: "10. Solve: x / 4 = 6",
    options: ["10", "18", "24", "30"],
    answer: 2,
    explain: "Multiply both sides by 4: x = 24."
  },
  {
    q: "11. Expand: (x + 2)(x + 3)",
    options: ["x² + 5x + 6", "x² + 6", "x² + 6x + 5", "2x + 5"],
    answer: 0,
    explain: "Multiply: x² + 3x + 2x + 6 = x² + 5x + 6."
  },
  {
    q: "12. Solve: 5x - 10 = 15",
    options: ["3", "4", "5", "6"],
    answer: 2,
    explain: "5x = 25, so x = 5."
  },
  {
    q: "13. What is x² when x = 4?",
    options: ["8", "12", "16", "20"],
    answer: 2,
    explain: "Substitute x = 4: 4² = 16."
  },
  {
    q: "14. Factorise: x² + 5x + 6",
    options: ["(x + 1)(x + 6)", "(x + 2)(x + 3)", "(x - 2)(x - 3)", "(x + 5)(x + 1)"],
    answer: 1,
    explain: "2 and 3 add to 5 and multiply to 6."
  },
  {
    q: "15. Solve: 4x + 1 = 17",
    options: ["3", "4", "5", "6"],
    answer: 1,
    explain: "4x = 16, so x = 4."
  },
  {
    q: "16. Simplify: (3x)(2x)",
    options: ["5x", "6x", "6x²", "5x²"],
    answer: 2,
    explain: "Multiply coefficients and variables: 3 × 2 × x × x = 6x²."
  },
  {
    q: "17. Solve: 2(x - 1) = 10",
    options: ["4", "5", "6", "7"],
    answer: 2,
    explain: "x - 1 = 5, so x = 6."
  },
  {
    q: "18. What is the degree of 5x³ + 2x² + 1?",
    options: ["1", "2", "3", "5"],
    answer: 2,
    explain: "The highest exponent of x is 3."
  },
  {
    q: "19. Solve: x² = 49, where x is real",
    options: ["7 only", "-7 only", "7 or -7", "49 only"],
    answer: 2,
    explain: "Both 7² and (-7)² equal 49."
  },
  {
    q: "20. Simplify: (x + 4) + (2x - 1)",
    options: ["3x + 3", "3x + 5", "2x + 3", "x + 3"],
    answer: 0,
    explain: "Combine like terms: x + 2x = 3x and 4 - 1 = 3."
  }
];

const form = document.getElementById("quizForm");

questions.forEach((item, i) => {
  const div = document.createElement("div");
  div.className = "question";

  let html = `<p>${item.q}</p>`;

  item.options.forEach((option, j) => {
    html += `
      <label>
        <input type="radio" name="q${i}" value="${j}">
        ${String.fromCharCode(65 + j)}. ${option}
      </label>`;
  });

  html += `<div class="feedback" id="feedback${i}"></div>`;
  div.innerHTML = html;
  form.appendChild(div);
});

function checkAnswers() {
  let score = 0;

  questions.forEach((item, i) => {
    const selected = document.querySelector(
      `input[name="q${i}"]:checked`
    );
    const feedback = document.getElementById(`feedback${i}`);

    if (selected && Number(selected.value) === item.answer) {
      score++;
      feedback.textContent = "Correct! " + item.explain;
      feedback.style.color = "green";
    } else {
      feedback.textContent = "Answer: " +
        item.options[item.answer] + ". " + item.explain;
      feedback.style.color = "red";
    }
  });

  document.getElementById("result").textContent =
    "Your Score: " + score + " / " + questions.length;
  window.scrollTo(0, document.body.scrollHeight);
}
</script>
</body>
</html>
